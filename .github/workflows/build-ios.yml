name: Build iOS

on:
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: Export a signed device IPA using this repository's Apple signing secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  simulator:
    name: Unsigned simulator build
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Apple toolchain
        run: bash tools/macos-preflight.sh
      - name: Build and test web assets and bundle them for iOS
        run: |
          npm ci
          npm test
          npm run build
      - name: Compile for iOS Simulator without a signing identity
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Project128.xcodeproj \
            -scheme Project128 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/simulator-build.log
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/Project128.app \
            build/Project128-simulator.zip
      - name: Save simulator application and compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project128-simulator
          path: |
            build/Project128-simulator.zip
            build/simulator-build.log
          if-no-files-found: warn
          retention-days: 7

  signed-ipa:
    name: Optional signed device archive
    if: ${{ inputs.sign_ipa }}
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Apple toolchain
        run: bash tools/macos-preflight.sh
      - name: Build local web bundle
        run: |
          npm ci
          npm run build
      - name: Import supplied signing identity into a temporary keychain
        env:
          APPLETEAMID: ${{ secrets.APPLETEAMID }}
          CERTIFICATEP12BASE64: ${{ secrets.CERTIFICATEP12BASE64 }}
          CERTPASSWORD: ${{ secrets.CERTPASSWORD }}
          PROFILEBASE64: ${{ secrets.PROFILEBASE64 }}
        run: |
          set -euo pipefail
          # Do not enable shell tracing: the following values are secrets.
          for variable in APPLETEAMID CERTIFICATEP12BASE64 CERTPASSWORD PROFILEBASE64; do
            if [[ -z "${!variable}" ]]; then
              printf 'Required repository secret is missing: %s\n' "$variable" >&2
              exit 1
            fi
          done
          signing_dir="$(mktemp -d "$RUNNER_TEMP/project128-signing.XXXXXX")"
          keychain_path="$signing_dir/build.keychain-db"
          printf 'SIGNING_DIR=%s\nKEYCHAIN_PATH=%s\n' "$signing_dir" "$keychain_path" >> "$GITHUB_ENV"
          security list-keychains -d user | python3 -c \
            'import sys; print("\n".join(line.strip().strip(chr(34)) for line in sys.stdin))' \
            > "$signing_dir/original-keychains.txt"
          printf '%s' "$CERTIFICATEP12BASE64" | base64 --decode > "$signing_dir/certificate.p12"
          printf '%s' "$PROFILEBASE64" | base64 --decode > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"
          keychain_password="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$signing_dir/certificate.p12" -P "$CERTPASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -t cert -f pkcs12 -k "$keychain_path" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path" >/dev/null
          security find-identity -v -p codesigning "$keychain_path" > "$signing_dir/identities.txt"
          SIGNING_DIR="$signing_dir" python3 <<'PY'
          import datetime, fnmatch, hashlib, os, pathlib, plistlib, re
          directory = pathlib.Path(os.environ['SIGNING_DIR'])
          profile = plistlib.loads((directory / 'profile.plist').read_bytes())
          team = os.environ['APPLETEAMID']
          if not re.fullmatch(r'[A-Z0-9]{10}', team):
              raise SystemExit('APPLETEAMID must be a ten-character Apple team identifier.')
          if team not in profile.get('TeamIdentifier', []):
              raise SystemExit('The supplied provisioning profile belongs to another Apple team.')
          expiry = profile.get('ExpirationDate')
          if not isinstance(expiry, datetime.datetime) or expiry.replace(tzinfo=datetime.timezone.utc) <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit('The supplied provisioning profile has expired or has no expiration date.')
          bundle = 'org.project128.player'
          entitlements = profile.get('Entitlements', {})
          application = entitlements.get('application-identifier', '')
          if '.' not in application or not fnmatch.fnmatchcase(bundle, application.split('.', 1)[1]):
              raise SystemExit('The profile does not authorize the org.project128.player bundle identifier.')
          if 'iOS' not in profile.get('Platform', []):
              raise SystemExit('The supplied profile is not an iOS provisioning profile.')
          uuid = profile.get('UUID', '')
          if not re.fullmatch(r'[A-Fa-f0-9-]{36}', uuid):
              raise SystemExit('The supplied profile has an invalid UUID.')
          identities = set(re.findall(r'\b[A-Fa-f0-9]{40}\b', (directory / 'identities.txt').read_text()))
          certificates = [hashlib.sha1(cert).hexdigest().upper() for cert in profile.get('DeveloperCertificates', [])]
          identity = next((cert for cert in certificates if cert in {value.upper() for value in identities}), None)
          if identity is None:
              raise SystemExit('No valid imported signing identity matches the supplied provisioning profile.')
          if profile.get('ProvisionsAllDevices'):
              method = 'enterprise'
          elif profile.get('ProvisionedDevices'):
              method = 'debugging' if entitlements.get('get-task-allow') else 'release-testing'
          else:
              method = 'app-store-connect'
          options = {'method': method, 'destination': 'export', 'signingStyle': 'manual',
                     'teamID': team, 'signingCertificate': identity,
                     'provisioningProfiles': {bundle: uuid}, 'stripSwiftSymbols': True}
          (directory / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'PROFILE_UUID={uuid}\nSIGNING_IDENTITY={identity}\nAPPLE_TEAM_ID={team}\n')
          PY
          original_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
          done < "$signing_dir/original-keychains.txt"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          profile_uuid="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1], "rb"))["UUID"])' "$signing_dir/profile.plist")"
          # Xcode versions use either of these per-user provisioning locations.
          for profile_directory in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$profile_directory"
            cp "$signing_dir/profile.mobileprovision" "$profile_directory/$profile_uuid.mobileprovision"
          done
          rm -f "$signing_dir/certificate.p12"
      - name: Archive and export the signed device IPA
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ios/Project128.xcodeproj \
            -scheme Project128 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Project128.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $KEYCHAIN_PATH" \
            archive 2>&1 | tee build/device-archive.log
          xcodebuild -exportArchive \
            -archivePath build/Project128.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$SIGNING_DIR/ExportOptions.plist" \
            2>&1 | tee build/ipa-export.log
          test -n "$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Save signed IPA and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project128-device
          path: |
            build/ipa/*.ipa
            build/device-archive.log
            build/ipa-export.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          set -uo pipefail
          if [[ -n "${SIGNING_DIR:-}" && -f "$SIGNING_DIR/original-keychains.txt" ]]; then
            original_keychains=()
            while IFS= read -r existing_keychain; do
              [[ -z "$existing_keychain" ]] || original_keychains+=("$existing_keychain")
            done < "$SIGNING_DIR/original-keychains.txt"
            if [[ ${#original_keychains[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${original_keychains[@]}" || true
            fi
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ "${PROFILE_UUID:-}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            rm -f \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${SIGNING_DIR:-}" && "$SIGNING_DIR" == "$RUNNER_TEMP"/project128-signing.* ]]; then
            rm -rf "$SIGNING_DIR"
          fi
